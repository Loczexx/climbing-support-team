[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climbing-support-team"
version = "0.2.0"
description = "Multi-agent AI support team for sport climbers (Supervisor, Climbing Coach, Nutritionist)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Aleksander Biernacki", email = "aleksanderbiernacki1@wp.pl" }
]
dependencies = [
    "pydantic>=2.7.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
